# This is a basic workflow to help you get started with Actions

name: CI
permissions: {}

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "pr_runner"
  pr_runner:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      # Get the branch name so that we know which version to run CI on
      - name: Extract branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "branch=${HEAD_REF}" >>"$GITHUB_OUTPUT"
        id: extract_branch

      # Tests of the tools that verify the tarball and make the data for the release data
      - name: Install the schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r tools/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run the tests of the tools
        run: |
          jq --version
          status=0
          count=0
          for test in tests/tools/test-*.bash; do
            [ -e "$test" ] || continue
            count=$((count + 1))
            echo "::group::$test"
            bash "$test" || status=1
            echo "::endgroup::"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::no tests/tools/test-*.bash file found"
            status=1
          fi
          python3 -m unittest discover -s tests/tools || status=1
          exit $status

      # Runs the test scripts using the runner's shell
      - name: Run tests
        env:
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          echo Running tests 
          chmod +x ./tests/image-tests.sh
          ./tests/image-tests.sh ${BRANCH:+"$BRANCH"}
        shell: bash

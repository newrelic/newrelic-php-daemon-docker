# This is a basic workflow to help you get started with Actions

name: CI
permissions: {}

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "pr_runner"
  pr_runner:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      # Get the branch name so that we know which version to run CI on
      - name: Extract branch name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "branch=${HEAD_REF}" >>"$GITHUB_OUTPUT"
        id: extract_branch

      # Tests of the tools that verify the tarball and make the data for the release data
      - name: Run the tests of the tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-jsonschema jq
          for test in tests/tools/test-*.bash; do bash "$test"; done
          python3 -m unittest discover -s tests/tools

      # Runs the test scripts using the runner's shell
      - name: Run tests
        env:
          BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          echo Running tests 
          chmod +x ./tests/image-tests.sh
          ./tests/image-tests.sh ${BRANCH:+"$BRANCH"}
        shell: bash

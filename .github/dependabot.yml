version: 2
updates:
  - package-ecosystem: github-actions
    # the workflows and the composite action in .github/actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "security:"

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"
